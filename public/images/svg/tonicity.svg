<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="320" fill="#eff6ff"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1e3a8a">Tonicity — Animal vs. Plant Cells in Different Solutions</text>

  <!-- Hypotonic -->
  <g transform="translate(40,80)">
    <text x="100" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#0c4a6e">Hypotonic</text>
    <text x="100" y="18" font-size="10" font-style="italic" text-anchor="middle" fill="#0c4a6e">(less solute outside)</text>
    <!-- Animal: bursting -->
    <g transform="translate(40,80)">
      <circle cx="0" cy="0" r="32" fill="#fecaca" stroke="#991b1b" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="0" y="55" font-size="9" font-weight="700" text-anchor="middle" fill="#991b1b">Animal: bursts</text>
    </g>
    <!-- Plant: turgid -->
    <g transform="translate(160,80)">
      <rect x="-32" y="-32" width="64" height="64" fill="#86efac" stroke="#14532d" stroke-width="3"/>
      <rect x="-26" y="-26" width="52" height="52" fill="#bbf7d0" stroke="#166534" stroke-width="1.5"/>
      <text x="0" y="55" font-size="9" font-weight="700" text-anchor="middle" fill="#14532d">Plant: turgid (good)</text>
    </g>
    <!-- Water arrows IN -->
    <g stroke="#1e40af" stroke-width="2" fill="#1e40af">
      <path d="M -30 -50 L -10 -25" marker-end="url(#tonAr)"/>
      <path d="M 230 -50 L 210 -25" marker-end="url(#tonAr)"/>
    </g>
  </g>

  <!-- Isotonic -->
  <g transform="translate(280,80)">
    <text x="100" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#0c4a6e">Isotonic</text>
    <text x="100" y="18" font-size="10" font-style="italic" text-anchor="middle" fill="#0c4a6e">(equal solute)</text>
    <g transform="translate(40,80)">
      <circle cx="0" cy="0" r="26" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
      <text x="0" y="55" font-size="9" font-weight="700" text-anchor="middle" fill="#991b1b">Animal: normal</text>
    </g>
    <g transform="translate(160,80)">
      <rect x="-32" y="-32" width="64" height="64" fill="#86efac" stroke="#14532d" stroke-width="3"/>
      <rect x="-22" y="-22" width="44" height="44" fill="#bbf7d0" stroke="#166534" stroke-width="1.5"/>
      <text x="0" y="55" font-size="9" font-weight="700" text-anchor="middle" fill="#14532d">Plant: flaccid</text>
    </g>
  </g>

  <!-- Hypertonic -->
  <g transform="translate(520,80)">
    <text x="100" y="0" font-size="14" font-weight="700" text-anchor="middle" fill="#0c4a6e">Hypertonic</text>
    <text x="100" y="18" font-size="10" font-style="italic" text-anchor="middle" fill="#0c4a6e">(more solute outside)</text>
    <g transform="translate(40,80)">
      <path d="M -22 -16 Q 0 -22 22 -16 Q 18 0 22 16 Q 0 22 -22 16 Q -18 0 -22 -16 Z" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
      <text x="0" y="55" font-size="9" font-weight="700" text-anchor="middle" fill="#991b1b">Animal: shrivels</text>
    </g>
    <g transform="translate(160,80)">
      <rect x="-32" y="-32" width="64" height="64" fill="#86efac" stroke="#14532d" stroke-width="3"/>
      <rect x="-14" y="-14" width="28" height="28" fill="#bbf7d0" stroke="#166534" stroke-width="1.5"/>
      <text x="0" y="55" font-size="9" font-weight="700" text-anchor="middle" fill="#14532d">Plant: plasmolysis</text>
    </g>
    <!-- Water arrows OUT -->
    <g stroke="#1e40af" stroke-width="2" fill="#1e40af">
      <path d="M -10 -25 L -30 -50" marker-end="url(#tonAr)"/>
      <path d="M 210 -25 L 230 -50" marker-end="url(#tonAr)"/>
    </g>
  </g>

  <text x="360" y="280" font-size="11" font-weight="600" text-anchor="middle" fill="#334155">Water moves toward the side with HIGHER solute concentration (= LOWER water concentration)</text>

  <defs>
    <marker id="tonAr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
  </defs>
</svg>
