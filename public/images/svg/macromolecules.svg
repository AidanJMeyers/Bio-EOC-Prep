<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="360" fill="#fafaf9"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">The Four Biological Macromolecules</text>

  <!-- Four equal columns -->
  <g transform="translate(20,60)">
    <!-- Carbohydrates -->
    <g>
      <rect width="160" height="270" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="80" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#9a3412">Carbohydrates</text>
      <!-- glucose icon: hexagon -->
      <polygon points="80,55 110,72 110,108 80,125 50,108 50,72" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/>
      <text x="80" y="94" font-size="11" font-weight="700" text-anchor="middle" fill="#9a3412">C₆H₁₂O₆</text>
      <text x="80" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#7c2d12">Monomer:</text>
      <text x="80" y="163" font-size="11" text-anchor="middle" fill="#7c2d12">monosaccharide</text>
      <text x="80" y="190" font-size="11" font-weight="700" text-anchor="middle" fill="#7c2d12">Function:</text>
      <text x="80" y="205" font-size="10" text-anchor="middle" fill="#7c2d12">quick energy</text>
      <text x="80" y="220" font-size="10" text-anchor="middle" fill="#7c2d12">structure (cellulose)</text>
      <text x="80" y="247" font-size="11" font-weight="700" text-anchor="middle" fill="#7c2d12">Examples:</text>
      <text x="80" y="262" font-size="10" text-anchor="middle" fill="#7c2d12">starch, glycogen</text>
    </g>
  </g>

  <g transform="translate(195,60)">
    <!-- Lipids -->
    <g>
      <rect width="160" height="270" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
      <text x="80" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#713f12">Lipids</text>
      <!-- phospholipid: head + tails -->
      <circle cx="80" cy="55" r="14" fill="#fde047" stroke="#713f12" stroke-width="1.5"/>
      <line x1="73" y1="68" x2="71" y2="120" stroke="#713f12" stroke-width="2"/>
      <line x1="87" y1="68" x2="89" y2="120" stroke="#713f12" stroke-width="2"/>
      <text x="80" y="135" font-size="9" text-anchor="middle" fill="#713f12">phospholipid</text>
      <text x="80" y="158" font-size="11" font-weight="700" text-anchor="middle" fill="#713f12">Built from:</text>
      <text x="80" y="173" font-size="11" text-anchor="middle" fill="#713f12">glycerol + fatty</text>
      <text x="80" y="187" font-size="11" text-anchor="middle" fill="#713f12">acids</text>
      <text x="80" y="210" font-size="11" font-weight="700" text-anchor="middle" fill="#713f12">Function:</text>
      <text x="80" y="223" font-size="10" text-anchor="middle" fill="#713f12">long-term energy</text>
      <text x="80" y="237" font-size="10" text-anchor="middle" fill="#713f12">membranes, hormones</text>
      <text x="80" y="262" font-size="10" font-style="italic" text-anchor="middle" fill="#713f12">hydrophobic</text>
    </g>
  </g>

  <g transform="translate(370,60)">
    <!-- Proteins -->
    <g>
      <rect width="160" height="270" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="80" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Proteins</text>
      <!-- chain of amino acids -->
      <g transform="translate(20,50)">
        <circle cx="10" cy="40" r="9" fill="#60a5fa" stroke="#1e3a8a"/>
        <circle cx="35" cy="25" r="9" fill="#60a5fa" stroke="#1e3a8a"/>
        <circle cx="60" cy="40" r="9" fill="#60a5fa" stroke="#1e3a8a"/>
        <circle cx="85" cy="25" r="9" fill="#60a5fa" stroke="#1e3a8a"/>
        <circle cx="110" cy="40" r="9" fill="#60a5fa" stroke="#1e3a8a"/>
        <line x1="19" y1="40" x2="26" y2="32" stroke="#1e3a8a" stroke-width="2"/>
        <line x1="44" y1="25" x2="51" y2="32" stroke="#1e3a8a" stroke-width="2"/>
        <line x1="69" y1="40" x2="76" y2="32" stroke="#1e3a8a" stroke-width="2"/>
        <line x1="94" y1="25" x2="101" y2="32" stroke="#1e3a8a" stroke-width="2"/>
      </g>
      <text x="80" y="120" font-size="9" text-anchor="middle" fill="#1e3a8a">amino acid chain</text>
      <text x="80" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">Monomer:</text>
      <text x="80" y="163" font-size="11" text-anchor="middle" fill="#1e3a8a">amino acid (20 types)</text>
      <text x="80" y="190" font-size="11" font-weight="700" text-anchor="middle" fill="#1e3a8a">Function:</text>
      <text x="80" y="205" font-size="10" text-anchor="middle" fill="#1e3a8a">enzymes, structure,</text>
      <text x="80" y="220" font-size="10" text-anchor="middle" fill="#1e3a8a">transport, signaling</text>
      <text x="80" y="248" font-size="10" font-weight="700" text-anchor="middle" fill="#1e3a8a">Contains: C, H, O, N</text>
      <text x="80" y="262" font-size="10" font-style="italic" text-anchor="middle" fill="#1e3a8a">shape = function</text>
    </g>
  </g>

  <g transform="translate(545,60)">
    <!-- Nucleic Acids -->
    <g>
      <rect width="160" height="270" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="80" y="22" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">Nucleic Acids</text>
      <!-- DNA double helix simple -->
      <g transform="translate(40,50)" stroke="#5b21b6" stroke-width="2" fill="none">
        <path d="M 5 0 C 30 20, 30 40, 5 60 C -20 80, -20 100, 5 120"/>
        <path d="M 75 0 C 50 20, 50 40, 75 60 C 100 80, 100 100, 75 120"/>
        <line x1="10" y1="10" x2="68" y2="10"/>
        <line x1="14" y1="30" x2="64" y2="30"/>
        <line x1="14" y1="50" x2="64" y2="50"/>
        <line x1="10" y1="70" x2="68" y2="70"/>
        <line x1="14" y1="90" x2="64" y2="90"/>
        <line x1="14" y1="110" x2="64" y2="110"/>
      </g>
      <text x="80" y="190" font-size="11" font-weight="700" text-anchor="middle" fill="#5b21b6">Monomer:</text>
      <text x="80" y="205" font-size="11" text-anchor="middle" fill="#5b21b6">nucleotide</text>
      <text x="80" y="225" font-size="11" font-weight="700" text-anchor="middle" fill="#5b21b6">Function:</text>
      <text x="80" y="240" font-size="10" text-anchor="middle" fill="#5b21b6">store / transmit</text>
      <text x="80" y="252" font-size="10" text-anchor="middle" fill="#5b21b6">genetic info</text>
      <text x="80" y="266" font-size="10" font-weight="700" text-anchor="middle" fill="#5b21b6">DNA, RNA</text>
    </g>
  </g>
</svg>
