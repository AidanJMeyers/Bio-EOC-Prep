<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Inter, system-ui, sans-serif">
  <rect width="600" height="360" fill="#f0f9ff"/>
  <text x="300" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#0c4a6e">Water (H₂O) — Polar Molecule</text>

  <!-- single water molecule on the left -->
  <g transform="translate(150,180)">
    <line x1="0" y1="0" x2="-58" y2="40" stroke="#475569" stroke-width="3"/>
    <line x1="0" y1="0" x2="58" y2="40" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="#dc2626"/>
    <text x="0" y="6" font-size="22" font-weight="700" text-anchor="middle" fill="white">O</text>
    <text x="0" y="-50" font-size="14" font-weight="700" text-anchor="middle" fill="#dc2626">δ⁻</text>
    <circle cx="-58" cy="40" r="22" fill="#0284c7"/>
    <text x="-58" y="46" font-size="14" font-weight="700" text-anchor="middle" fill="white">H</text>
    <text x="-72" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#0284c7">δ⁺</text>
    <circle cx="58" cy="40" r="22" fill="#0284c7"/>
    <text x="58" y="46" font-size="14" font-weight="700" text-anchor="middle" fill="white">H</text>
    <text x="72" y="78" font-size="13" font-weight="700" text-anchor="middle" fill="#0284c7">δ⁺</text>
    <text x="0" y="120" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">104.5° bent shape</text>
  </g>

  <!-- hydrogen bonding cluster on the right -->
  <g transform="translate(420,170)">
    <text x="0" y="-105" font-size="13" font-weight="700" text-anchor="middle" fill="#0c4a6e">Hydrogen bonds between H₂O molecules</text>
    <!-- center molecule -->
    <g>
      <circle cx="0" cy="0" r="28" fill="#dc2626"/>
      <text x="0" y="5" font-size="16" font-weight="700" text-anchor="middle" fill="white">O</text>
      <circle cx="-25" cy="-22" r="14" fill="#0284c7"/>
      <text x="-25" y="-18" font-size="10" font-weight="700" text-anchor="middle" fill="white">H</text>
      <circle cx="25" cy="-22" r="14" fill="#0284c7"/>
      <text x="25" y="-18" font-size="10" font-weight="700" text-anchor="middle" fill="white">H</text>
    </g>
    <!-- top molecule -->
    <g transform="translate(0,-90)">
      <circle cx="0" cy="0" r="22" fill="#dc2626"/>
      <text x="0" y="4" font-size="13" font-weight="700" text-anchor="middle" fill="white">O</text>
      <circle cx="-18" cy="22" r="11" fill="#0284c7"/>
      <text x="-18" y="26" font-size="9" font-weight="700" text-anchor="middle" fill="white">H</text>
      <circle cx="18" cy="22" r="11" fill="#0284c7"/>
      <text x="18" y="26" font-size="9" font-weight="700" text-anchor="middle" fill="white">H</text>
    </g>
    <!-- left molecule -->
    <g transform="translate(-90,40)">
      <circle cx="0" cy="0" r="22" fill="#dc2626"/>
      <text x="0" y="4" font-size="13" font-weight="700" text-anchor="middle" fill="white">O</text>
      <circle cx="22" cy="-15" r="11" fill="#0284c7"/>
      <text x="22" y="-11" font-size="9" font-weight="700" text-anchor="middle" fill="white">H</text>
      <circle cx="-15" cy="22" r="11" fill="#0284c7"/>
      <text x="-15" y="26" font-size="9" font-weight="700" text-anchor="middle" fill="white">H</text>
    </g>
    <!-- right molecule -->
    <g transform="translate(90,40)">
      <circle cx="0" cy="0" r="22" fill="#dc2626"/>
      <text x="0" y="4" font-size="13" font-weight="700" text-anchor="middle" fill="white">O</text>
      <circle cx="-22" cy="-15" r="11" fill="#0284c7"/>
      <text x="-22" y="-11" font-size="9" font-weight="700" text-anchor="middle" fill="white">H</text>
      <circle cx="15" cy="22" r="11" fill="#0284c7"/>
      <text x="15" y="26" font-size="9" font-weight="700" text-anchor="middle" fill="white">H</text>
    </g>
    <!-- H-bond dotted lines -->
    <line x1="0" y1="-55" x2="0" y2="-28" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="-65" y1="35" x2="-30" y2="-5" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="65" y1="35" x2="30" y2="-5" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="0" y="115" font-size="11" font-style="italic" text-anchor="middle" fill="#7c3aed">dotted = hydrogen bonds</text>
  </g>

  <!-- Properties strip at bottom -->
  <g transform="translate(20,310)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#334155">Polarity →</text>
    <text x="80" y="0" font-size="11" fill="#334155">universal solvent · cohesion · adhesion · high specific heat · ice less dense than liquid</text>
  </g>
</svg>
