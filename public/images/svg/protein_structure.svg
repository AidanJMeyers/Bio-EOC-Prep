<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="320" fill="#eff6ff"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1e3a8a">Protein Structure — 4 Levels</text>

  <!-- Primary -->
  <g transform="translate(50,150)">
    <text x="65" y="-90" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">1° Primary</text>
    <text x="65" y="-75" font-size="9" font-style="italic" text-anchor="middle" fill="#1e40af">amino acid sequence</text>
    <!-- Linear chain -->
    <g>
      <circle cx="5" cy="0" r="9" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="25" cy="0" r="9" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="45" cy="0" r="9" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="65" cy="0" r="9" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="85" cy="0" r="9" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="105" cy="0" r="9" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="14" y1="0" x2="16" y2="0" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="34" y1="0" x2="36" y2="0" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="54" y1="0" x2="56" y2="0" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="74" y1="0" x2="76" y2="0" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="94" y1="0" x2="96" y2="0" stroke="#1e3a8a" stroke-width="2"/>
    </g>
    <text x="65" y="50" font-size="10" text-anchor="middle" fill="#1e40af">peptide bonds</text>
  </g>

  <!-- Secondary -->
  <g transform="translate(220,150)">
    <text x="65" y="-90" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">2° Secondary</text>
    <text x="65" y="-75" font-size="9" font-style="italic" text-anchor="middle" fill="#1e40af">α-helix or β-sheet</text>
    <!-- alpha helix -->
    <path d="M 10 -25 C 35 -20, 35 -10, 10 -5 C -15 0, -15 10, 10 15 C 35 20, 35 30, 10 35" stroke="#1e3a8a" stroke-width="3" fill="none"/>
    <text x="35" y="50" font-size="10" text-anchor="middle" fill="#1e40af">α-helix shown</text>
    <!-- β-sheet -->
    <g transform="translate(80,-15)">
      <path d="M 0 0 L 10 5 L 20 0 L 30 5 L 40 0 L 50 5" stroke="#1e3a8a" stroke-width="2" fill="none"/>
      <path d="M 0 20 L 10 25 L 20 20 L 30 25 L 40 20 L 50 25" stroke="#1e3a8a" stroke-width="2" fill="none"/>
      <line x1="5" y1="3" x2="5" y2="23" stroke="#94a3b8" stroke-dasharray="2 2"/>
      <line x1="15" y1="3" x2="15" y2="23" stroke="#94a3b8" stroke-dasharray="2 2"/>
      <line x1="25" y1="3" x2="25" y2="23" stroke="#94a3b8" stroke-dasharray="2 2"/>
    </g>
    <text x="105" y="50" font-size="10" text-anchor="middle" fill="#1e40af">β-sheet</text>
    <text x="65" y="65" font-size="9" font-style="italic" text-anchor="middle" fill="#475569">H-bonds in backbone</text>
  </g>

  <!-- Tertiary -->
  <g transform="translate(400,150)">
    <text x="65" y="-90" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">3° Tertiary</text>
    <text x="65" y="-75" font-size="9" font-style="italic" text-anchor="middle" fill="#1e40af">3D fold of one chain</text>
    <!-- Blob shape -->
    <path d="M 30 -20 C 60 -25, 90 -10, 100 5 C 110 20, 95 35, 70 40 C 50 45, 35 30, 25 25 C 10 20, 5 5, 15 -5 C 22 -15, 25 -22, 30 -20 Z" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2.5"/>
    <!-- helix inside -->
    <path d="M 35 0 C 50 5, 50 15, 35 20 C 20 25, 20 35, 35 40" stroke="#1e3a8a" stroke-width="2" fill="none"/>
    <text x="65" y="65" font-size="9" font-style="italic" text-anchor="middle" fill="#475569">side-chain interactions</text>
  </g>

  <!-- Quaternary -->
  <g transform="translate(575,150)">
    <text x="60" y="-90" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">4° Quaternary</text>
    <text x="60" y="-75" font-size="9" font-style="italic" text-anchor="middle" fill="#1e40af">multiple chains</text>
    <!-- 4 globules of hemoglobin -->
    <circle cx="40" cy="-10" r="22" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="80" cy="-10" r="22" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="40" cy="30" r="22" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="80" cy="30" r="22" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="40" y="-7" font-size="9" font-weight="700" text-anchor="middle" fill="#1e3a8a">α</text>
    <text x="80" y="-7" font-size="9" font-weight="700" text-anchor="middle" fill="#1e3a8a">β</text>
    <text x="40" y="33" font-size="9" font-weight="700" text-anchor="middle" fill="#1e3a8a">α</text>
    <text x="80" y="33" font-size="9" font-weight="700" text-anchor="middle" fill="#1e3a8a">β</text>
    <text x="60" y="65" font-size="9" font-style="italic" text-anchor="middle" fill="#475569">e.g., hemoglobin</text>
  </g>

  <!-- Bottom alert: denaturation -->
  <rect x="40" y="270" width="640" height="38" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="360" y="290" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">Heat or extreme pH disrupts H-bonds and ionic bonds → DENATURATION</text>
  <text x="360" y="304" font-size="10" font-style="italic" text-anchor="middle" fill="#991b1b">Shape lost → function lost (usually irreversible)</text>
</svg>
