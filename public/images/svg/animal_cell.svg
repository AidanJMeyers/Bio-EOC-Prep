<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="440" fill="#fdf4ff"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#581c87">Animal Cell</text>

  <!-- Cell membrane (rounded blob) -->
  <ellipse cx="360" cy="230" rx="280" ry="170" fill="#fae8ff" stroke="#86198f" stroke-width="3"/>

  <!-- Cytoplasm dots -->
  <g fill="#d8b4fe" opacity="0.5">
    <circle cx="220" cy="160" r="4"/><circle cx="500" cy="180" r="3"/>
    <circle cx="180" cy="280" r="3"/><circle cx="540" cy="320" r="4"/>
    <circle cx="600" cy="250" r="3"/>
  </g>

  <!-- Nucleus -->
  <g>
    <circle cx="320" cy="210" r="60" fill="#a78bfa" stroke="#581c87" stroke-width="2.5"/>
    <circle cx="320" cy="210" r="48" fill="#c4b5fd" stroke="#581c87" stroke-width="1"/>
    <circle cx="320" cy="210" r="12" fill="#5b21b6"/>
    <text x="320" y="214" font-size="9" font-weight="700" text-anchor="middle" fill="white">nucleolus</text>
  </g>
  <text x="220" y="170" font-size="11" font-weight="700" fill="#581c87">Nucleus</text>
  <line x1="245" y1="175" x2="280" y2="200" stroke="#581c87" stroke-width="1"/>

  <!-- Mitochondrion -->
  <g transform="translate(460,180)">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/>
    <path d="M -30 -8 Q -25 0 -30 8 M -15 -10 Q -10 0 -15 10 M 0 -10 Q 5 0 0 10 M 15 -10 Q 20 0 15 10 M 30 -8 Q 25 0 30 8" stroke="#7f1d1d" stroke-width="1.5" fill="none"/>
  </g>
  <text x="540" y="170" font-size="11" font-weight="700" fill="#7f1d1d">Mitochondrion (ATP)</text>
  <line x1="535" y1="175" x2="500" y2="180" stroke="#7f1d1d" stroke-width="1"/>

  <!-- Rough ER -->
  <g transform="translate(420,290)">
    <path d="M 0 0 Q 30 -10 60 0 Q 90 10 120 0" stroke="#22c55e" stroke-width="3" fill="none"/>
    <path d="M 0 12 Q 30 2 60 12 Q 90 22 120 12" stroke="#22c55e" stroke-width="3" fill="none"/>
    <g fill="#15803d">
      <circle cx="10" cy="0" r="3"/><circle cx="30" cy="-3" r="3"/><circle cx="50" cy="-1" r="3"/><circle cx="70" cy="3" r="3"/><circle cx="90" cy="6" r="3"/><circle cx="110" cy="3" r="3"/>
      <circle cx="10" cy="14" r="3"/><circle cx="30" cy="11" r="3"/><circle cx="50" cy="13" r="3"/><circle cx="70" cy="15" r="3"/><circle cx="90" cy="18" r="3"/><circle cx="110" cy="15" r="3"/>
    </g>
  </g>
  <text x="540" y="305" font-size="11" font-weight="700" fill="#15803d">Rough ER</text>
  <line x1="535" y1="310" x2="540" y2="298" stroke="#15803d" stroke-width="1"/>
  <text x="540" y="325" font-size="9" fill="#166534">(ribosomes attached)</text>

  <!-- Golgi -->
  <g transform="translate(220,300)">
    <path d="M 0 0 Q 30 -8 60 0" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <path d="M 5 12 Q 32 4 55 12" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <path d="M 10 24 Q 32 18 50 24" stroke="#f59e0b" stroke-width="4" fill="none"/>
  </g>
  <text x="120" y="290" font-size="11" font-weight="700" fill="#92400e">Golgi apparatus</text>
  <line x1="195" y1="295" x2="222" y2="305" stroke="#92400e" stroke-width="1"/>

  <!-- Ribosomes (free) -->
  <circle cx="200" cy="225" r="5" fill="#0369a1"/>
  <circle cx="215" cy="240" r="5" fill="#0369a1"/>
  <circle cx="225" cy="220" r="5" fill="#0369a1"/>
  <text x="120" y="240" font-size="11" font-weight="700" fill="#0369a1">Free ribosomes</text>
  <line x1="180" y1="232" x2="195" y2="227" stroke="#0369a1" stroke-width="1"/>

  <!-- Lysosome -->
  <circle cx="500" cy="350" r="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
  <text x="540" y="354" font-size="11" font-weight="700" fill="#78350f">Lysosome</text>
  <line x1="535" y1="350" x2="514" y2="350" stroke="#78350f" stroke-width="1"/>

  <!-- Cell membrane label -->
  <text x="360" y="80" font-size="11" font-weight="700" fill="#86198f">Cell (plasma) membrane</text>
  <line x1="360" y1="86" x2="360" y2="60" stroke="#86198f" stroke-width="1"/>

  <!-- Centrioles -->
  <g transform="translate(380,360)">
    <rect x="-12" y="-3" width="24" height="6" fill="#475569"/>
    <rect x="-3" y="-12" width="6" height="24" fill="#475569"/>
  </g>
  <text x="320" y="395" font-size="11" font-weight="700" fill="#334155">Centrioles (animal-only)</text>
  <line x1="370" y1="385" x2="380" y2="370" stroke="#334155" stroke-width="1"/>
</svg>
