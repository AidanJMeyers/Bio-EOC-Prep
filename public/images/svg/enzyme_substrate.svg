<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Inter, system-ui, sans-serif">
  <rect width="700" height="320" fill="#f0fdf4"/>
  <text x="350" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#14532d">Enzyme &amp; Substrate (Induced Fit)</text>

  <defs>
    <marker id="grnArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Step 1: Enzyme + Substrate -->
  <g transform="translate(40,170)">
    <text x="60" y="-90" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">1. Substrate binds</text>
    <!-- Enzyme blob with notch -->
    <path d="M 0 0 C 0 -50, 50 -60, 80 -55 C 100 -55, 100 -30, 90 -25 L 75 -10 L 60 0 L 75 10 L 90 25 C 100 30, 100 55, 80 55 C 50 60, 0 50, 0 0 Z" fill="#86efac" stroke="#14532d" stroke-width="2"/>
    <text x="35" y="5" font-size="12" font-weight="700" fill="#14532d">enzyme</text>
    <!-- Substrate -->
    <g transform="translate(140,-15)">
      <polygon points="0,0 30,-10 50,5 30,20" fill="#fde047" stroke="#854d0e" stroke-width="1.5"/>
      <text x="25" y="35" font-size="11" font-weight="700" fill="#854d0e">substrate</text>
    </g>
  </g>

  <!-- Step 2: Complex -->
  <g transform="translate(280,170)">
    <text x="60" y="-90" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">2. Enzyme-substrate complex</text>
    <path d="M 0 0 C 0 -50, 50 -60, 80 -55 C 105 -55, 110 -25, 90 -10 L 65 5 L 90 20 C 110 30, 105 55, 80 55 C 50 60, 0 50, 0 0 Z" fill="#86efac" stroke="#14532d" stroke-width="2"/>
    <polygon points="65,-10 95,-20 115,-5 95,10 75,5" fill="#fde047" stroke="#854d0e" stroke-width="1.5"/>
    <text x="60" y="80" font-size="11" font-style="italic" text-anchor="middle" fill="#365314">active site fits substrate (induced fit)</text>
  </g>

  <!-- Step 3: Products -->
  <g transform="translate(540,170)">
    <text x="60" y="-90" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">3. Products release</text>
    <path d="M 0 0 C 0 -50, 50 -60, 80 -55 C 100 -55, 100 -30, 90 -25 L 75 -10 L 60 0 L 75 10 L 90 25 C 100 30, 100 55, 80 55 C 50 60, 0 50, 0 0 Z" fill="#86efac" stroke="#14532d" stroke-width="2"/>
    <text x="35" y="5" font-size="12" font-weight="700" fill="#14532d">enzyme</text>
    <text x="35" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#365314">enzyme is reusable</text>
    <!-- Products -->
    <circle cx="140" cy="-20" r="10" fill="#fde047" stroke="#854d0e" stroke-width="1.5"/>
    <circle cx="160" cy="10" r="9" fill="#fde047" stroke="#854d0e" stroke-width="1.5"/>
    <text x="170" y="40" font-size="11" font-weight="700" fill="#854d0e">products</text>
  </g>

  <!-- Arrows between -->
  <line x1="220" y1="160" x2="270" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#grnArr)"/>
  <line x1="475" y1="160" x2="530" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#grnArr)"/>

  <!-- Bottom note -->
  <rect x="40" y="270" width="620" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="350" y="293" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">Enzymes lower activation energy. Heat or extreme pH → denature → loss of shape → loss of function.</text>
</svg>
