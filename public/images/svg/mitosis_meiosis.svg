<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="460" fill="#f0f9ff"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#0c4a6e">Mitosis vs. Meiosis</text>

  <!-- MITOSIS row -->
  <g transform="translate(0,60)">
    <text x="20" y="20" font-size="14" font-weight="700" fill="#0c4a6e">MITOSIS</text>
    <text x="20" y="36" font-size="10" font-style="italic" fill="#075985">1 division → 2 diploid identical daughters</text>

    <!-- Parent cell -->
    <g transform="translate(80,90)">
      <circle r="34" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
      <line x1="-15" y1="-10" x2="-15" y2="10" stroke="#dc2626" stroke-width="3"/>
      <line x1="-12" y1="-10" x2="-12" y2="10" stroke="#dc2626" stroke-width="3"/>
      <line x1="12" y1="-10" x2="12" y2="10" stroke="#1d4ed8" stroke-width="3"/>
      <line x1="15" y1="-10" x2="15" y2="10" stroke="#1d4ed8" stroke-width="3"/>
      <text y="55" font-size="10" text-anchor="middle" fill="#0c4a6e">parent (2n)</text>
    </g>

    <!-- DNA replication -->
    <text x="170" y="90" font-size="11" font-weight="700" text-anchor="middle" fill="#0c4a6e">→ replicate</text>
    <g transform="translate(240,90)">
      <circle r="34" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
      <g stroke="#dc2626" stroke-width="3">
        <line x1="-18" y1="-12" x2="-18" y2="12"/>
        <line x1="-15" y1="-12" x2="-15" y2="12"/>
        <line x1="-12" y1="-12" x2="-12" y2="12"/>
        <line x1="-9" y1="-12" x2="-9" y2="12"/>
      </g>
      <g stroke="#1d4ed8" stroke-width="3">
        <line x1="9" y1="-12" x2="9" y2="12"/>
        <line x1="12" y1="-12" x2="12" y2="12"/>
        <line x1="15" y1="-12" x2="15" y2="12"/>
        <line x1="18" y1="-12" x2="18" y2="12"/>
      </g>
      <text y="55" font-size="10" text-anchor="middle" fill="#0c4a6e">sister chromatids</text>
    </g>

    <text x="335" y="90" font-size="11" font-weight="700" text-anchor="middle" fill="#0c4a6e">→ split</text>

    <!-- Two daughters -->
    <g transform="translate(420,60)">
      <circle r="28" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
      <line x1="-12" y1="-8" x2="-12" y2="8" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="-9" y1="-8" x2="-9" y2="8" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="9" y1="-8" x2="9" y2="8" stroke="#1d4ed8" stroke-width="2.5"/>
      <line x1="12" y1="-8" x2="12" y2="8" stroke="#1d4ed8" stroke-width="2.5"/>
    </g>
    <g transform="translate(420,120)">
      <circle r="28" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
      <line x1="-12" y1="-8" x2="-12" y2="8" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="-9" y1="-8" x2="-9" y2="8" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="9" y1="-8" x2="9" y2="8" stroke="#1d4ed8" stroke-width="2.5"/>
      <line x1="12" y1="-8" x2="12" y2="8" stroke="#1d4ed8" stroke-width="2.5"/>
    </g>
    <text x="475" y="93" font-size="11" font-weight="700" fill="#1e40af">2 IDENTICAL</text>
    <text x="475" y="108" font-size="11" font-weight="700" fill="#1e40af">DIPLOID (2n)</text>
  </g>

  <!-- divider -->
  <line x1="20" y1="240" x2="700" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- MEIOSIS row -->
  <g transform="translate(0,260)">
    <text x="20" y="20" font-size="14" font-weight="700" fill="#7f1d1d">MEIOSIS</text>
    <text x="20" y="36" font-size="10" font-style="italic" fill="#991b1b">2 divisions → 4 haploid varied gametes (crossing over + independent assortment)</text>

    <!-- Parent -->
    <g transform="translate(60,100)">
      <circle r="32" fill="#fee2e2" stroke="#7f1d1d" stroke-width="2"/>
      <line x1="-15" y1="-10" x2="-15" y2="10" stroke="#dc2626" stroke-width="3"/>
      <line x1="-12" y1="-10" x2="-12" y2="10" stroke="#dc2626" stroke-width="3"/>
      <line x1="12" y1="-10" x2="12" y2="10" stroke="#1d4ed8" stroke-width="3"/>
      <line x1="15" y1="-10" x2="15" y2="10" stroke="#1d4ed8" stroke-width="3"/>
      <text y="50" font-size="10" text-anchor="middle" fill="#7f1d1d">2n parent</text>
    </g>

    <text x="135" y="100" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Meiosis I</text>
    <text x="135" y="115" font-size="9" text-anchor="middle" fill="#991b1b">homologs split</text>

    <!-- Two haploid cells with sister chromatids -->
    <g transform="translate(220,80)">
      <circle r="26" fill="#fee2e2" stroke="#7f1d1d" stroke-width="2"/>
      <line x1="-3" y1="-12" x2="-3" y2="12" stroke="#dc2626" stroke-width="3"/>
      <line x1="3" y1="-12" x2="3" y2="12" stroke="#dc2626" stroke-width="3"/>
      <text y="42" font-size="9" text-anchor="middle" fill="#7f1d1d">n</text>
    </g>
    <g transform="translate(220,140)">
      <circle r="26" fill="#fee2e2" stroke="#7f1d1d" stroke-width="2"/>
      <line x1="-3" y1="-12" x2="-3" y2="12" stroke="#1d4ed8" stroke-width="3"/>
      <line x1="3" y1="-12" x2="3" y2="12" stroke="#1d4ed8" stroke-width="3"/>
      <text y="42" font-size="9" text-anchor="middle" fill="#7f1d1d">n</text>
    </g>

    <text x="290" y="100" font-size="10" font-weight="700" text-anchor="middle" fill="#7f1d1d">Meiosis II</text>
    <text x="290" y="115" font-size="9" text-anchor="middle" fill="#991b1b">sisters split</text>

    <!-- Four gametes -->
    <g fill="#fee2e2" stroke="#7f1d1d" stroke-width="2">
      <circle cx="380" cy="40" r="22"/>
      <circle cx="380" cy="100" r="22"/>
      <circle cx="380" cy="160" r="22"/>
      <circle cx="380" cy="220" r="22"/>
    </g>
    <line x1="380" y1="32" x2="380" y2="48" stroke="#dc2626" stroke-width="3"/>
    <line x1="380" y1="92" x2="380" y2="108" stroke="#dc2626" stroke-width="3"/>
    <line x1="380" y1="152" x2="380" y2="168" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="380" y1="212" x2="380" y2="228" stroke="#1d4ed8" stroke-width="3"/>

    <text x="445" y="120" font-size="11" font-weight="700" fill="#7f1d1d">4 HAPLOID</text>
    <text x="445" y="135" font-size="11" font-weight="700" fill="#7f1d1d">VARIED</text>
    <text x="445" y="150" font-size="11" font-weight="700" fill="#7f1d1d">gametes (n)</text>
  </g>
</svg>
