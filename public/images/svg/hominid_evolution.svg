<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="320" fill="#fdf4ff"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#581c87">Evidence for Evolution — Hominid Skulls Through Time</text>

  <!-- Three stylized skulls -->
  <!-- Australopithecus afarensis -->
  <g transform="translate(140,160)">
    <!-- skull cranium -->
    <ellipse cx="0" cy="0" rx="48" ry="38" fill="#e7e5e4" stroke="#1f2937" stroke-width="2"/>
    <!-- pronounced jaw forward -->
    <path d="M -20 25 Q -10 50 30 35 L 35 10 Q 25 18 -20 25 Z" fill="#e7e5e4" stroke="#1f2937" stroke-width="2"/>
    <!-- eye -->
    <ellipse cx="-12" cy="-5" rx="8" ry="6" fill="#1f2937"/>
    <text x="0" y="-58" font-size="11" font-weight="700" text-anchor="middle" fill="#581c87">Australopithecus</text>
    <text x="0" y="-46" font-size="11" font-style="italic" text-anchor="middle" fill="#581c87">afarensis</text>
    <text x="0" y="76" font-size="10" text-anchor="middle" fill="#475569">3–4 million yrs ago</text>
    <text x="0" y="92" font-size="9" font-style="italic" text-anchor="middle" fill="#6b7280">small brain · pronounced jaw</text>
  </g>

  <!-- Homo erectus -->
  <g transform="translate(360,160)">
    <ellipse cx="0" cy="-5" rx="55" ry="42" fill="#e7e5e4" stroke="#1f2937" stroke-width="2"/>
    <!-- brow ridge -->
    <path d="M -42 -20 Q -25 -30 -8 -20" stroke="#1f2937" stroke-width="3" fill="none"/>
    <path d="M 8 -20 Q 25 -30 42 -20" stroke="#1f2937" stroke-width="3" fill="none"/>
    <path d="M -15 25 Q -5 42 25 30 L 30 5 Q 22 14 -15 25 Z" fill="#e7e5e4" stroke="#1f2937" stroke-width="2"/>
    <ellipse cx="-15" cy="-10" rx="9" ry="6" fill="#1f2937"/>
    <text x="0" y="-65" font-size="11" font-weight="700" text-anchor="middle" fill="#581c87">Homo erectus</text>
    <text x="0" y="76" font-size="10" text-anchor="middle" fill="#475569">1.8M – 100K yrs ago</text>
    <text x="0" y="92" font-size="9" font-style="italic" text-anchor="middle" fill="#6b7280">larger brain · used tools, fire</text>
  </g>

  <!-- Homo sapiens -->
  <g transform="translate(580,160)">
    <ellipse cx="0" cy="-10" rx="60" ry="50" fill="#e7e5e4" stroke="#1f2937" stroke-width="2"/>
    <path d="M -10 30 Q 0 45 18 38 L 22 8 Q 14 16 -10 30 Z" fill="#e7e5e4" stroke="#1f2937" stroke-width="2"/>
    <ellipse cx="-15" cy="-15" rx="9" ry="6" fill="#1f2937"/>
    <text x="0" y="-78" font-size="11" font-weight="700" text-anchor="middle" fill="#581c87">Homo sapiens</text>
    <text x="0" y="76" font-size="10" text-anchor="middle" fill="#475569">200K yrs ago – present</text>
    <text x="0" y="92" font-size="9" font-style="italic" text-anchor="middle" fill="#6b7280">large brain · vertical forehead</text>
  </g>

  <!-- Time arrow -->
  <line x1="80" y1="270" x2="640" y2="270" stroke="#581c87" stroke-width="3" marker-end="url(#evArr)"/>
  <text x="360" y="295" font-size="11" font-weight="700" text-anchor="middle" fill="#581c87">Time → (transitional fossils support common ancestry)</text>

  <defs>
    <marker id="evArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#581c87"/>
    </marker>
  </defs>
</svg>
