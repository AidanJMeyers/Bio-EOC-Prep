<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Inter, system-ui, sans-serif">
  <rect width="600" height="380" fill="#fefce8"/>
  <text x="300" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#365314">Energy Pyramid — 10% Rule</text>

  <!-- Pyramid layers (bottom up) -->
  <!-- Layer 1: producers -->
  <polygon points="80,310 520,310 480,260 120,260" fill="#bbf7d0" stroke="#14532d" stroke-width="2"/>
  <text x="300" y="293" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">Producers (plants, algae)</text>
  <text x="540" y="290" font-size="11" font-weight="700" fill="#14532d">10,000 J</text>

  <!-- Layer 2: primary -->
  <polygon points="120,260 480,260 440,210 160,210" fill="#fde68a" stroke="#854d0e" stroke-width="2"/>
  <text x="300" y="243" font-size="13" font-weight="700" text-anchor="middle" fill="#854d0e">Primary consumers (herbivores)</text>
  <text x="540" y="240" font-size="11" font-weight="700" fill="#854d0e">1,000 J</text>

  <!-- Layer 3: secondary -->
  <polygon points="160,210 440,210 400,160 200,160" fill="#fdba74" stroke="#7c2d12" stroke-width="2"/>
  <text x="300" y="193" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">Secondary consumers (small carnivores)</text>
  <text x="540" y="190" font-size="11" font-weight="700" fill="#7c2d12">100 J</text>

  <!-- Layer 4: tertiary -->
  <polygon points="200,160 400,160 360,110 240,110" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/>
  <text x="300" y="143" font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">Tertiary consumers</text>
  <text x="540" y="140" font-size="11" font-weight="700" fill="#7f1d1d">10 J</text>

  <!-- Top tip: apex -->
  <polygon points="240,110 360,110 300,60" fill="#a78bfa" stroke="#5b21b6" stroke-width="2"/>
  <text x="300" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#5b21b6">Apex</text>
  <text x="540" y="92" font-size="11" font-weight="700" fill="#5b21b6">1 J</text>

  <!-- Arrows showing 10% transfer -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <path d="M 60 300 L 60 250" marker-end="url(#epArr)"/>
    <path d="M 60 250 L 60 200" marker-end="url(#epArr)"/>
    <path d="M 60 200 L 60 150" marker-end="url(#epArr)"/>
    <path d="M 60 150 L 60 100" marker-end="url(#epArr)"/>
  </g>
  <text x="35" y="225" font-size="11" font-weight="700" text-anchor="middle" fill="#7f1d1d" transform="rotate(-90 35 225)">10% transfer per level — 90% lost as heat</text>

  <!-- Legend -->
  <text x="300" y="350" font-size="11" font-style="italic" text-anchor="middle" fill="#475569">Why food chains rarely exceed 4–5 levels: energy runs out.</text>

  <defs>
    <marker id="epArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
