<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="360" fill="#eff6ff"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#0c4a6e">Central Dogma: DNA → mRNA → Protein</text>

  <!-- Three boxes with arrows -->
  <defs>
    <marker id="cdArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0c4a6e"/>
    </marker>
  </defs>

  <!-- DNA -->
  <g transform="translate(60,150)">
    <rect width="160" height="120" rx="14" fill="white" stroke="#7c3aed" stroke-width="3"/>
    <text x="80" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#5b21b6">DNA</text>
    <!-- mini helix -->
    <g transform="translate(80,68)" stroke="#5b21b6" stroke-width="2.5" fill="none">
      <path d="M -15 -25 C 5 -15, 5 -5, -15 5 C -35 15, -35 25, -15 35"/>
      <path d="M 15 -25 C -5 -15, -5 -5, 15 5 C 35 15, 35 25, 15 35"/>
      <line x1="-13" y1="-15" x2="13" y2="-15"/>
      <line x1="-13" y1="-5" x2="13" y2="-5"/>
      <line x1="-13" y1="5" x2="13" y2="5"/>
      <line x1="-13" y1="15" x2="13" y2="15"/>
      <line x1="-13" y1="25" x2="13" y2="25"/>
    </g>
    <text x="80" y="115" font-size="10" font-style="italic" text-anchor="middle" fill="#5b21b6">in nucleus</text>
  </g>

  <!-- arrow + label -->
  <g>
    <line x1="225" y1="210" x2="285" y2="210" stroke="#0c4a6e" stroke-width="3" marker-end="url(#cdArr)"/>
    <rect x="232" y="170" width="48" height="32" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="256" y="185" font-size="9" font-weight="700" text-anchor="middle" fill="#92400e">TRANS-</text>
    <text x="256" y="196" font-size="9" font-weight="700" text-anchor="middle" fill="#92400e">CRIPTION</text>
  </g>

  <!-- mRNA -->
  <g transform="translate(290,150)">
    <rect width="160" height="120" rx="14" fill="white" stroke="#0891b2" stroke-width="3"/>
    <text x="80" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#155e75">mRNA</text>
    <!-- Single strand with codons -->
    <g transform="translate(20,55)">
      <rect x="0" y="0" width="120" height="20" fill="#cffafe" stroke="#155e75" stroke-width="1.5" rx="2"/>
      <line x1="30" y1="0" x2="30" y2="20" stroke="#155e75"/>
      <line x1="60" y1="0" x2="60" y2="20" stroke="#155e75"/>
      <line x1="90" y1="0" x2="90" y2="20" stroke="#155e75"/>
      <text x="15" y="14" font-size="9" font-weight="700" text-anchor="middle" fill="#155e75">AUG</text>
      <text x="45" y="14" font-size="9" font-weight="700" text-anchor="middle" fill="#155e75">GCU</text>
      <text x="75" y="14" font-size="9" font-weight="700" text-anchor="middle" fill="#155e75">CCG</text>
      <text x="105" y="14" font-size="9" font-weight="700" text-anchor="middle" fill="#155e75">UAA</text>
    </g>
    <text x="80" y="100" font-size="9" text-anchor="middle" fill="#155e75">codons (3 bases each)</text>
    <text x="80" y="115" font-size="10" font-style="italic" text-anchor="middle" fill="#155e75">in cytoplasm</text>
  </g>

  <!-- arrow + label -->
  <g>
    <line x1="455" y1="210" x2="515" y2="210" stroke="#0c4a6e" stroke-width="3" marker-end="url(#cdArr)"/>
    <rect x="462" y="170" width="48" height="32" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="486" y="185" font-size="9" font-weight="700" text-anchor="middle" fill="#92400e">TRANS-</text>
    <text x="486" y="196" font-size="9" font-weight="700" text-anchor="middle" fill="#92400e">LATION</text>
  </g>

  <!-- Protein -->
  <g transform="translate(520,150)">
    <rect width="160" height="120" rx="14" fill="white" stroke="#16a34a" stroke-width="3"/>
    <text x="80" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">Protein</text>
    <!-- amino acid chain -->
    <g transform="translate(20,60)">
      <circle cx="0" cy="10" r="8" fill="#86efac" stroke="#14532d"/>
      <circle cx="22" cy="0" r="8" fill="#86efac" stroke="#14532d"/>
      <circle cx="44" cy="10" r="8" fill="#86efac" stroke="#14532d"/>
      <circle cx="66" cy="0" r="8" fill="#86efac" stroke="#14532d"/>
      <circle cx="88" cy="10" r="8" fill="#86efac" stroke="#14532d"/>
      <circle cx="110" cy="0" r="8" fill="#86efac" stroke="#14532d"/>
      <line x1="7" y1="10" x2="14" y2="3" stroke="#14532d" stroke-width="2"/>
      <line x1="29" y1="0" x2="36" y2="6" stroke="#14532d" stroke-width="2"/>
      <line x1="51" y1="10" x2="58" y2="3" stroke="#14532d" stroke-width="2"/>
      <line x1="73" y1="0" x2="80" y2="6" stroke="#14532d" stroke-width="2"/>
      <line x1="95" y1="10" x2="102" y2="3" stroke="#14532d" stroke-width="2"/>
    </g>
    <text x="80" y="100" font-size="9" text-anchor="middle" fill="#14532d">amino acid chain</text>
    <text x="80" y="115" font-size="10" font-style="italic" text-anchor="middle" fill="#14532d">at the ribosome</text>
  </g>

  <!-- Bottom flow text -->
  <text x="360" y="320" font-size="11" font-weight="600" text-anchor="middle" fill="#334155">tRNA brings amino acids; ribosome reads codons; translates 3 bases → 1 amino acid</text>
</svg>
