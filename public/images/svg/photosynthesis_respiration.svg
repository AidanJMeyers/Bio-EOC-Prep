<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="400" fill="#fefce8"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#365314">Photosynthesis ⇄ Cellular Respiration</text>

  <!-- Sun -->
  <g transform="translate(360,80)">
    <circle r="32" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <text y="6" font-size="14" font-weight="700" text-anchor="middle" fill="#713f12">SUN</text>
    <g stroke="#ca8a04" stroke-width="2.5">
      <line x1="0" y1="-50" x2="0" y2="-40"/>
      <line x1="35" y1="-35" x2="42" y2="-42"/>
      <line x1="50" y1="0" x2="40" y2="0"/>
      <line x1="35" y1="35" x2="42" y2="42"/>
      <line x1="-35" y1="-35" x2="-42" y2="-42"/>
      <line x1="-50" y1="0" x2="-40" y2="0"/>
      <line x1="-35" y1="35" x2="-42" y2="42"/>
    </g>
  </g>

  <!-- Chloroplast (left) -->
  <g transform="translate(150,250)">
    <ellipse cx="0" cy="0" rx="80" ry="48" fill="#bbf7d0" stroke="#166534" stroke-width="3"/>
    <ellipse cx="-30" cy="-12" rx="22" ry="10" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
    <ellipse cx="20" cy="0" rx="22" ry="10" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
    <ellipse cx="-15" cy="15" rx="22" ry="10" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
    <text x="0" y="60" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">Chloroplast</text>
    <text x="0" y="76" font-size="10" font-style="italic" text-anchor="middle" fill="#365314">(plants only)</text>
  </g>
  <text x="150" y="330" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">PHOTOSYNTHESIS</text>
  <text x="150" y="348" font-size="10" text-anchor="middle" fill="#365314">stores energy as glucose</text>

  <!-- Mitochondrion (right) -->
  <g transform="translate(570,250)">
    <ellipse cx="0" cy="0" rx="80" ry="36" fill="#fecaca" stroke="#7f1d1d" stroke-width="3"/>
    <path d="M -60 -15 Q -50 0 -60 15 M -35 -22 Q -25 0 -35 22 M -10 -22 Q 0 0 -10 22 M 15 -22 Q 25 0 15 22 M 40 -22 Q 50 0 40 22 M 60 -15 Q 50 0 60 15" stroke="#7f1d1d" stroke-width="2" fill="none"/>
    <text x="0" y="60" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">Mitochondrion</text>
    <text x="0" y="76" font-size="10" font-style="italic" text-anchor="middle" fill="#7f1d1d">(plants AND animals)</text>
  </g>
  <text x="570" y="330" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">CELLULAR RESPIRATION</text>
  <text x="570" y="348" font-size="10" text-anchor="middle" fill="#991b1b">releases energy as ATP</text>

  <!-- Center: equations -->
  <g transform="translate(360,210)">
    <rect x="-115" y="-55" width="230" height="110" rx="10" fill="white" stroke="#475569" stroke-width="2"/>
    <text x="0" y="-32" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">PHOTO →</text>
    <text x="0" y="-12" font-size="10" text-anchor="middle" fill="#1e293b">6 CO₂ + 6 H₂O + light</text>
    <text x="0" y="3" font-size="13" font-weight="700" text-anchor="middle" fill="#0369a1">↓</text>
    <text x="0" y="18" font-size="10" text-anchor="middle" fill="#1e293b">C₆H₁₂O₆ + 6 O₂</text>
    <text x="0" y="38" font-size="11" font-weight="700" text-anchor="middle" fill="#7f1d1d">← RESPIRATION</text>
  </g>

  <!-- Arrow from sun to chloroplast -->
  <path d="M 340 100 Q 240 150 175 218" stroke="#ca8a04" stroke-width="3" stroke-dasharray="5 4" fill="none" marker-end="url(#prArr)"/>
  <text x="245" y="155" font-size="10" font-style="italic" fill="#854d0e">light energy</text>

  <!-- Glucose flow chloroplast → mitochondrion -->
  <path d="M 240 245 L 480 250" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#prArr2)"/>
  <text x="360" y="240" font-size="10" font-weight="700" text-anchor="middle" fill="#15803d">glucose + O₂</text>

  <!-- CO2/H2O return -->
  <path d="M 480 270 L 240 270" stroke="#7f1d1d" stroke-width="2.5" stroke-dasharray="4 3" fill="none" marker-end="url(#prArr3)"/>
  <text x="360" y="288" font-size="10" font-weight="700" text-anchor="middle" fill="#991b1b">CO₂ + H₂O</text>

  <defs>
    <marker id="prArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ca8a04"/>
    </marker>
    <marker id="prArr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="prArr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#991b1b"/>
    </marker>
  </defs>
</svg>
