<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="420" fill="#fef2f2"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#7f1d1d">Cardiovascular System — Two Circuits</text>

  <!-- Heart in middle -->
  <g transform="translate(330,200)">
    <path d="M 0 0 C -10 -25, -50 -25, -50 0 C -50 25, 0 50, 0 70 C 0 50, 50 25, 50 0 C 50 -25, 10 -25, 0 0 Z" fill="#fca5a5" stroke="#7f1d1d" stroke-width="3"/>
    <text x="0" y="35" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">HEART</text>
  </g>

  <!-- Lungs -->
  <g transform="translate(330,80)">
    <ellipse cx="-50" cy="0" rx="38" ry="48" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <ellipse cx="50" cy="0" rx="38" ry="48" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="0" y="5" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">LUNGS</text>
  </g>

  <!-- Pulmonary circuit arrows -->
  <g fill="none" stroke-width="3">
    <!-- right ventricle to lung (deoxy = blue) -->
    <path d="M 305 200 Q 240 150 285 130" stroke="#1d4ed8" marker-end="url(#cvA)"/>
    <text x="220" y="170" font-size="9" font-weight="700" fill="#1d4ed8">CO₂-rich</text>
    <text x="220" y="184" font-size="9" font-style="italic" fill="#1d4ed8">to lungs</text>
    <!-- lung to left atrium (oxy = red) -->
    <path d="M 375 130 Q 425 150 360 200" stroke="#dc2626" marker-end="url(#cvA)"/>
    <text x="430" y="170" font-size="9" font-weight="700" fill="#dc2626">O₂-rich</text>
    <text x="430" y="184" font-size="9" font-style="italic" fill="#dc2626">from lungs</text>
  </g>

  <!-- Body / systemic -->
  <g transform="translate(330,340)">
    <rect x="-95" y="-40" width="190" height="60" rx="14" fill="#fde68a" stroke="#854d0e" stroke-width="2"/>
    <text x="0" y="-12" font-size="13" font-weight="700" text-anchor="middle" fill="#854d0e">BODY TISSUES</text>
    <text x="0" y="6" font-size="10" text-anchor="middle" fill="#854d0e">muscles · brain · organs · skin</text>
    <text x="0" y="20" font-size="9" font-style="italic" text-anchor="middle" fill="#92400e">capillaries: gas + nutrient exchange</text>
  </g>

  <!-- Systemic circuit arrows -->
  <g fill="none" stroke-width="3">
    <path d="M 360 270 Q 460 305 380 305" stroke="#dc2626" marker-end="url(#cvA)"/>
    <text x="465" y="255" font-size="9" font-weight="700" fill="#dc2626">O₂-rich</text>
    <text x="465" y="270" font-size="9" font-style="italic" fill="#dc2626">to body</text>
    <path d="M 280 305 Q 200 305 305 270" stroke="#1d4ed8" marker-end="url(#cvA)"/>
    <text x="190" y="255" font-size="9" font-weight="700" fill="#1d4ed8">CO₂-rich</text>
    <text x="190" y="270" font-size="9" font-style="italic" fill="#1d4ed8">from body</text>
  </g>

  <!-- Vessel types panel -->
  <g transform="translate(540,80)">
    <rect width="160" height="220" rx="10" fill="white" stroke="#7f1d1d" stroke-width="2"/>
    <text x="80" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">Vessel types</text>
    <line x1="10" y1="32" x2="150" y2="32" stroke="#7f1d1d"/>

    <text x="10" y="52" font-size="11" font-weight="700" fill="#dc2626">Artery</text>
    <text x="10" y="68" font-size="9" fill="#1f2937">AWAY from heart</text>
    <text x="10" y="80" font-size="9" fill="#1f2937">thick muscular wall</text>

    <text x="10" y="105" font-size="11" font-weight="700" fill="#1d4ed8">Vein</text>
    <text x="10" y="121" font-size="9" fill="#1f2937">BACK to heart</text>
    <text x="10" y="133" font-size="9" fill="#1f2937">thin wall + valves</text>

    <text x="10" y="158" font-size="11" font-weight="700" fill="#7c2d12">Capillary</text>
    <text x="10" y="174" font-size="9" fill="#1f2937">EXCHANGE site</text>
    <text x="10" y="186" font-size="9" fill="#1f2937">1-cell-thick wall</text>

    <text x="10" y="207" font-size="9" font-style="italic" fill="#6b7280">A·V·C mnemonic</text>
  </g>

  <!-- Bottom note -->
  <rect x="40" y="380" width="640" height="28" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="360" y="399" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">Atherosclerosis in coronary arteries → reduced blood flow to heart muscle → heart attack</text>

  <defs>
    <marker id="cvA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
</svg>
