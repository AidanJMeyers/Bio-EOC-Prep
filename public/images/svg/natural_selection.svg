<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="360" fill="#f0fdf4"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#14532d">Natural Selection — Peppered Moths Example</text>

  <!-- Stage 1: Pre-pollution -->
  <g transform="translate(60,80)">
    <text x="80" y="0" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">Before pollution</text>
    <text x="80" y="16" font-size="10" font-style="italic" text-anchor="middle" fill="#365314">light bark of birch trees</text>
    <!-- background tree -->
    <rect x="0" y="30" width="160" height="160" fill="#f5f5f4" stroke="#9ca3af" stroke-width="2"/>
    <!-- moths: many light, few dark -->
    <g>
      <ellipse cx="40" cy="60" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="100" cy="80" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="60" cy="120" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="120" cy="140" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="40" cy="170" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="80" cy="100" rx="14" ry="8" fill="#1f2937"/>
    </g>
    <text x="80" y="210" font-size="10" font-weight="700" text-anchor="middle" fill="#14532d">Mostly light moths</text>
    <text x="80" y="225" font-size="9" font-style="italic" text-anchor="middle" fill="#365314">light = camouflaged, survive</text>
  </g>

  <!-- Arrow -->
  <text x="245" y="180" font-size="36" font-weight="700" fill="#16a34a">→</text>

  <!-- Stage 2: After pollution -->
  <g transform="translate(280,80)">
    <text x="80" y="0" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">After industrial pollution</text>
    <text x="80" y="16" font-size="10" font-style="italic" text-anchor="middle" fill="#365314">soot darkens tree bark</text>
    <rect x="0" y="30" width="160" height="160" fill="#374151" stroke="#1f2937" stroke-width="2"/>
    <g>
      <ellipse cx="40" cy="60" rx="14" ry="8" fill="#1f2937"/>
      <ellipse cx="100" cy="80" rx="14" ry="8" fill="#1f2937"/>
      <ellipse cx="60" cy="120" rx="14" ry="8" fill="#1f2937"/>
      <ellipse cx="120" cy="140" rx="14" ry="8" fill="#1f2937"/>
      <ellipse cx="40" cy="170" rx="14" ry="8" fill="#1f2937"/>
      <ellipse cx="80" cy="100" rx="14" ry="8" fill="#f5f5f4" stroke="#dc2626" stroke-width="2"/>
      <line x1="68" y1="92" x2="92" y2="108" stroke="#dc2626" stroke-width="3"/>
    </g>
    <text x="80" y="210" font-size="10" font-weight="700" text-anchor="middle" fill="#14532d">Mostly DARK moths</text>
    <text x="80" y="225" font-size="9" font-style="italic" text-anchor="middle" fill="#365314">light moths eaten by birds</text>
  </g>

  <!-- Arrow -->
  <text x="465" y="180" font-size="36" font-weight="700" fill="#16a34a">→</text>

  <!-- Stage 3: After clean air laws -->
  <g transform="translate(500,80)">
    <text x="80" y="0" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">After clean-air laws</text>
    <text x="80" y="16" font-size="10" font-style="italic" text-anchor="middle" fill="#365314">trees lighten again</text>
    <rect x="0" y="30" width="160" height="160" fill="#e7e5e4" stroke="#9ca3af" stroke-width="2"/>
    <g>
      <ellipse cx="40" cy="60" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="100" cy="80" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="60" cy="120" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="120" cy="140" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="40" cy="170" rx="14" ry="8" fill="#1f2937"/>
      <ellipse cx="80" cy="100" rx="14" ry="8" fill="#f5f5f4" stroke="#1f2937" stroke-width="1.5"/>
    </g>
    <text x="80" y="210" font-size="10" font-weight="700" text-anchor="middle" fill="#14532d">Light moths return</text>
    <text x="80" y="225" font-size="9" font-style="italic" text-anchor="middle" fill="#365314">selection direction reverses</text>
  </g>

  <!-- Bottom: 4 conditions -->
  <g transform="translate(60,290)">
    <rect width="600" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="300" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#92400e">4 requirements for natural selection</text>
    <text x="300" y="40" font-size="11" text-anchor="middle" fill="#92400e">1. Variation · 2. Heritable · 3. Differential reproduction · 4. Time / generations</text>
  </g>
</svg>
