<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Inter, system-ui, sans-serif">
  <rect width="700" height="380" fill="#fdf4ff"/>
  <text x="350" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#581c87">DNA — Double Helix &amp; Base Pairing</text>

  <!-- Helix on the left -->
  <g transform="translate(180,200)">
    <!-- Backbone strands -->
    <path d="M -50 -150 C -10 -120, -90 -90, -50 -60 C -10 -30, -90 0, -50 30 C -10 60, -90 90, -50 120 C -10 150, -90 175, -55 175" stroke="#86198f" stroke-width="5" fill="none"/>
    <path d="M 50 -150 C 10 -120, 90 -90, 50 -60 C 10 -30, 90 0, 50 30 C 10 60, 90 90, 50 120 C 10 150, 90 175, 55 175" stroke="#86198f" stroke-width="5" fill="none"/>

    <!-- Base pair rungs (alternating colors A-T / G-C) -->
    <g font-family="Inter" font-size="10" font-weight="700" text-anchor="middle">
      <!-- A-T -->
      <line x1="-45" y1="-130" x2="45" y2="-130" stroke="#0369a1" stroke-width="6"/>
      <text x="-30" y="-126" fill="white">A</text>
      <text x="30" y="-126" fill="white">T</text>
      <!-- G-C -->
      <line x1="-50" y1="-100" x2="50" y2="-100" stroke="#dc2626" stroke-width="6"/>
      <text x="-30" y="-96" fill="white">G</text>
      <text x="30" y="-96" fill="white">C</text>
      <!-- T-A -->
      <line x1="-50" y1="-70" x2="50" y2="-70" stroke="#0369a1" stroke-width="6"/>
      <text x="-30" y="-66" fill="white">T</text>
      <text x="30" y="-66" fill="white">A</text>
      <!-- C-G -->
      <line x1="-45" y1="-40" x2="45" y2="-40" stroke="#dc2626" stroke-width="6"/>
      <text x="-30" y="-36" fill="white">C</text>
      <text x="30" y="-36" fill="white">G</text>
      <!-- A-T -->
      <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#0369a1" stroke-width="6"/>
      <text x="-30" y="-6" fill="white">A</text>
      <text x="30" y="-6" fill="white">T</text>
      <!-- G-C -->
      <line x1="-50" y1="20" x2="50" y2="20" stroke="#dc2626" stroke-width="6"/>
      <text x="-30" y="24" fill="white">G</text>
      <text x="30" y="24" fill="white">C</text>
      <!-- T-A -->
      <line x1="-45" y1="50" x2="45" y2="50" stroke="#0369a1" stroke-width="6"/>
      <text x="-30" y="54" fill="white">T</text>
      <text x="30" y="54" fill="white">A</text>
      <!-- C-G -->
      <line x1="-50" y1="80" x2="50" y2="80" stroke="#dc2626" stroke-width="6"/>
      <text x="-30" y="84" fill="white">C</text>
      <text x="30" y="84" fill="white">G</text>
      <!-- A-T -->
      <line x1="-50" y1="110" x2="50" y2="110" stroke="#0369a1" stroke-width="6"/>
      <text x="-30" y="114" fill="white">A</text>
      <text x="30" y="114" fill="white">T</text>
      <!-- G-C -->
      <line x1="-45" y1="140" x2="45" y2="140" stroke="#dc2626" stroke-width="6"/>
      <text x="-30" y="144" fill="white">G</text>
      <text x="30" y="144" fill="white">C</text>
    </g>

    <text x="-90" y="-160" font-size="10" font-weight="700" fill="#86198f">5'</text>
    <text x="80" y="-160" font-size="10" font-weight="700" fill="#86198f">3'</text>
    <text x="-90" y="195" font-size="10" font-weight="700" fill="#86198f">3'</text>
    <text x="80" y="195" font-size="10" font-weight="700" fill="#86198f">5'</text>
    <text x="0" y="-180" font-size="11" font-style="italic" text-anchor="middle" fill="#86198f">antiparallel strands</text>
  </g>

  <!-- Right side: legend / rules -->
  <g transform="translate(380,80)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#581c87">Chargaff's rule</text>
    <line x1="0" y1="10" x2="280" y2="10" stroke="#86198f" stroke-width="1"/>

    <g transform="translate(0,30)">
      <rect width="280" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
      <text x="20" y="20" font-size="14" font-weight="700" fill="#1e3a8a">A</text>
      <text x="40" y="20" font-size="14" fill="#1e3a8a">↔</text>
      <text x="60" y="20" font-size="14" font-weight="700" fill="#1e3a8a">T</text>
      <text x="100" y="20" font-size="11" fill="#1e40af">(2 H-bonds)</text>
      <text x="20" y="35" font-size="9" fill="#1e3a8a">adenine</text>
      <text x="55" y="35" font-size="9" fill="#1e3a8a">thymine</text>
    </g>

    <g transform="translate(0,80)">
      <rect width="280" height="40" rx="6" fill="#fee2e2" stroke="#991b1b"/>
      <text x="20" y="20" font-size="14" font-weight="700" fill="#7f1d1d">G</text>
      <text x="40" y="20" font-size="14" fill="#7f1d1d">↔</text>
      <text x="60" y="20" font-size="14" font-weight="700" fill="#7f1d1d">C</text>
      <text x="100" y="20" font-size="11" fill="#991b1b">(3 H-bonds)</text>
      <text x="20" y="35" font-size="9" fill="#7f1d1d">guanine</text>
      <text x="55" y="35" font-size="9" fill="#7f1d1d">cytosine</text>
    </g>

    <g transform="translate(0,140)">
      <rect width="280" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="14" y="18" font-size="11" font-weight="700" fill="#92400e">RNA differences</text>
      <text x="14" y="34" font-size="10" fill="#92400e">• Single-stranded</text>
      <text x="14" y="46" font-size="10" fill="#92400e">• Ribose (not deoxyribose) · U replaces T</text>
    </g>

    <g transform="translate(0,200)">
      <rect width="280" height="60" rx="6" fill="#dcfce7" stroke="#15803d"/>
      <text x="14" y="18" font-size="11" font-weight="700" fill="#14532d">Each nucleotide:</text>
      <text x="14" y="35" font-size="10" fill="#14532d">phosphate + sugar + base</text>
      <text x="14" y="50" font-size="10" font-style="italic" fill="#15803d">backbone is sugar-phosphate; bases pair internally</text>
    </g>
  </g>
</svg>
