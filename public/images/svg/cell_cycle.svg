<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Inter, system-ui, sans-serif">
  <rect width="600" height="420" fill="#f5f3ff"/>
  <text x="300" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#5b21b6">The Cell Cycle</text>

  <!-- Outer interphase circle -->
  <circle cx="300" cy="220" r="140" fill="none" stroke="#a78bfa" stroke-width="32"/>

  <!-- Pie sections -->
  <!-- G1 -->
  <path d="M 300 220 L 300 80 A 140 140 0 0 1 422 268 Z" fill="#fde047" stroke="#5b21b6" stroke-width="2"/>
  <!-- S -->
  <path d="M 300 220 L 422 268 A 140 140 0 0 1 247 348 Z" fill="#86efac" stroke="#5b21b6" stroke-width="2"/>
  <!-- G2 -->
  <path d="M 300 220 L 247 348 A 140 140 0 0 1 178 268 Z" fill="#fdba74" stroke="#5b21b6" stroke-width="2"/>
  <!-- M phase wedge (smaller) -->
  <path d="M 300 220 L 178 268 A 140 140 0 0 1 300 80 Z" fill="#f87171" stroke="#5b21b6" stroke-width="2"/>

  <!-- Labels -->
  <text x="380" y="170" font-size="20" font-weight="700" fill="#713f12">G₁</text>
  <text x="380" y="190" font-size="10" fill="#713f12">growth</text>
  <text x="380" y="295" font-size="20" font-weight="700" fill="#14532d">S</text>
  <text x="380" y="312" font-size="10" fill="#14532d">DNA replication</text>
  <text x="220" y="320" font-size="20" font-weight="700" fill="#9a3412">G₂</text>
  <text x="220" y="338" font-size="10" fill="#9a3412">prep for division</text>
  <text x="200" y="170" font-size="18" font-weight="700" fill="#7f1d1d">M</text>
  <text x="200" y="188" font-size="10" fill="#7f1d1d">mitosis +</text>
  <text x="200" y="200" font-size="10" fill="#7f1d1d">cytokinesis</text>

  <!-- Center cell sketch -->
  <g transform="translate(300,220)">
    <circle r="35" fill="white" stroke="#5b21b6" stroke-width="2"/>
    <circle r="10" fill="#a78bfa"/>
    <text y="3" font-size="10" font-weight="700" text-anchor="middle" fill="white">DNA</text>
  </g>

  <!-- Interphase label across top of outer ring -->
  <text x="300" y="62" font-size="13" font-weight="700" text-anchor="middle" fill="#5b21b6">INTERPHASE (G₁ → S → G₂)</text>

  <!-- Checkpoints -->
  <circle cx="300" cy="80" r="6" fill="#dc2626"/>
  <circle cx="178" cy="268" r="6" fill="#dc2626"/>
  <circle cx="247" cy="348" r="6" fill="#dc2626"/>
  <text x="300" y="395" font-size="10" font-style="italic" text-anchor="middle" fill="#991b1b">● checkpoints — failure of these → cancer</text>
</svg>
