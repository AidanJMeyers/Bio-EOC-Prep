<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="380" fill="#fff7ed"/>
  <text x="360" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#7c2d12">Membrane Transport</text>

  <!-- Phospholipid bilayer (3 panels) -->
  <g transform="translate(40,160)">
    <text x="100" y="-105" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">Simple diffusion</text>
    <text x="100" y="-90" font-size="10" font-style="italic" text-anchor="middle" fill="#9a3412">passive · down gradient</text>
    <!-- Bilayer -->
    <g>
      <line x1="0" y1="-30" x2="200" y2="-30" stroke="#d97706" stroke-width="2"/>
      <line x1="0" y1="30" x2="200" y2="30" stroke="#d97706" stroke-width="2"/>
      <g fill="#fbbf24">
        <circle cx="10" cy="-30" r="6"/><circle cx="30" cy="-30" r="6"/><circle cx="50" cy="-30" r="6"/><circle cx="70" cy="-30" r="6"/><circle cx="90" cy="-30" r="6"/><circle cx="110" cy="-30" r="6"/><circle cx="130" cy="-30" r="6"/><circle cx="150" cy="-30" r="6"/><circle cx="170" cy="-30" r="6"/><circle cx="190" cy="-30" r="6"/>
        <circle cx="10" cy="30" r="6"/><circle cx="30" cy="30" r="6"/><circle cx="50" cy="30" r="6"/><circle cx="70" cy="30" r="6"/><circle cx="90" cy="30" r="6"/><circle cx="110" cy="30" r="6"/><circle cx="130" cy="30" r="6"/><circle cx="150" cy="30" r="6"/><circle cx="170" cy="30" r="6"/><circle cx="190" cy="30" r="6"/>
      </g>
      <!-- tails -->
      <g stroke="#d97706" stroke-width="1.5">
        <line x1="10" y1="-30" x2="10" y2="0"/><line x1="30" y1="-30" x2="30" y2="0"/><line x1="50" y1="-30" x2="50" y2="0"/><line x1="70" y1="-30" x2="70" y2="0"/><line x1="90" y1="-30" x2="90" y2="0"/><line x1="110" y1="-30" x2="110" y2="0"/><line x1="130" y1="-30" x2="130" y2="0"/><line x1="150" y1="-30" x2="150" y2="0"/><line x1="170" y1="-30" x2="170" y2="0"/><line x1="190" y1="-30" x2="190" y2="0"/>
        <line x1="10" y1="30" x2="10" y2="0"/><line x1="30" y1="30" x2="30" y2="0"/><line x1="50" y1="30" x2="50" y2="0"/><line x1="70" y1="30" x2="70" y2="0"/><line x1="90" y1="30" x2="90" y2="0"/><line x1="110" y1="30" x2="110" y2="0"/><line x1="130" y1="30" x2="130" y2="0"/><line x1="150" y1="30" x2="150" y2="0"/><line x1="170" y1="30" x2="170" y2="0"/><line x1="190" y1="30" x2="190" y2="0"/>
      </g>
    </g>
    <!-- O2 molecules going through -->
    <circle cx="80" cy="-65" r="6" fill="#3b82f6"/><circle cx="120" cy="-50" r="6" fill="#3b82f6"/>
    <circle cx="100" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="80" cy="55" r="6" fill="#3b82f6"/><circle cx="140" cy="65" r="6" fill="#3b82f6"/>
    <text x="100" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#1e40af">O₂, CO₂ pass freely</text>
    <text x="-25" y="-60" font-size="10" font-weight="700" fill="#7c2d12">High</text>
    <text x="-25" y="65" font-size="10" font-weight="700" fill="#7c2d12">Low</text>
    <path d="M -10 -55 L -10 60" stroke="#7c2d12" stroke-width="1" marker-end="url(#trArr)"/>
  </g>

  <!-- Facilitated diffusion -->
  <g transform="translate(280,160)">
    <text x="100" y="-105" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">Facilitated diffusion</text>
    <text x="100" y="-90" font-size="10" font-style="italic" text-anchor="middle" fill="#9a3412">passive · via channel</text>
    <line x1="0" y1="-30" x2="200" y2="-30" stroke="#d97706" stroke-width="2"/>
    <line x1="0" y1="30" x2="200" y2="30" stroke="#d97706" stroke-width="2"/>
    <g fill="#fbbf24">
      <circle cx="10" cy="-30" r="6"/><circle cx="30" cy="-30" r="6"/><circle cx="50" cy="-30" r="6"/><circle cx="70" cy="-30" r="6"/><circle cx="130" cy="-30" r="6"/><circle cx="150" cy="-30" r="6"/><circle cx="170" cy="-30" r="6"/><circle cx="190" cy="-30" r="6"/>
      <circle cx="10" cy="30" r="6"/><circle cx="30" cy="30" r="6"/><circle cx="50" cy="30" r="6"/><circle cx="70" cy="30" r="6"/><circle cx="130" cy="30" r="6"/><circle cx="150" cy="30" r="6"/><circle cx="170" cy="30" r="6"/><circle cx="190" cy="30" r="6"/>
    </g>
    <!-- channel protein -->
    <rect x="85" y="-35" width="30" height="70" fill="#a78bfa" stroke="#5b21b6" stroke-width="2" rx="4"/>
    <rect x="95" y="-35" width="10" height="70" fill="#ddd6fe"/>
    <!-- Glucose particles -->
    <circle cx="100" cy="-55" r="8" fill="#16a34a"/>
    <circle cx="100" cy="0" r="8" fill="#16a34a"/>
    <circle cx="100" cy="55" r="8" fill="#16a34a"/>
    <text x="100" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#15803d">e.g., glucose via GLUT</text>
  </g>

  <!-- Active transport -->
  <g transform="translate(520,160)">
    <text x="100" y="-105" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">Active transport</text>
    <text x="100" y="-90" font-size="10" font-style="italic" text-anchor="middle" fill="#9a3412">requires ATP · against gradient</text>
    <line x1="0" y1="-30" x2="200" y2="-30" stroke="#d97706" stroke-width="2"/>
    <line x1="0" y1="30" x2="200" y2="30" stroke="#d97706" stroke-width="2"/>
    <g fill="#fbbf24">
      <circle cx="10" cy="-30" r="6"/><circle cx="30" cy="-30" r="6"/><circle cx="50" cy="-30" r="6"/><circle cx="70" cy="-30" r="6"/><circle cx="130" cy="-30" r="6"/><circle cx="150" cy="-30" r="6"/><circle cx="170" cy="-30" r="6"/><circle cx="190" cy="-30" r="6"/>
      <circle cx="10" cy="30" r="6"/><circle cx="30" cy="30" r="6"/><circle cx="50" cy="30" r="6"/><circle cx="70" cy="30" r="6"/><circle cx="130" cy="30" r="6"/><circle cx="150" cy="30" r="6"/><circle cx="170" cy="30" r="6"/><circle cx="190" cy="30" r="6"/>
    </g>
    <!-- pump -->
    <path d="M 80 -35 L 120 -35 L 130 0 L 120 35 L 80 35 L 70 0 Z" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
    <!-- ATP burst -->
    <polygon points="100,0 110,-12 122,-3 116,8 124,18 110,15 102,22 95,12 85,15" fill="#fbbf24" stroke="#92400e"/>
    <text x="100" y="3" font-size="9" font-weight="700" text-anchor="middle" fill="#7c2d12">ATP</text>
    <!-- Particles being pumped against gradient -->
    <circle cx="100" cy="55" r="7" fill="#dc2626"/>
    <circle cx="100" cy="-50" r="7" fill="#dc2626"/>
    <text x="100" y="80" font-size="10" font-style="italic" text-anchor="middle" fill="#991b1b">e.g., Na⁺/K⁺ pump</text>
  </g>

  <text x="360" y="350" font-size="11" font-weight="600" text-anchor="middle" fill="#334155">Inside cell ↑   ·   Outside cell ↓</text>
  <defs>
    <marker id="trArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c2d12"/>
    </marker>
  </defs>
</svg>
